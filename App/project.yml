name: AozoraEbooks
options:
  bundleIdPrefix: io.github.saltymouse
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  AozoraKit:
    path: ..
targets:
  AozoraEbooks:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: AozoraKit
        product: AozoraKit
    settings:
      base:
        PRODUCT_NAME: Aozora Ebooks
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saltymouse.AozoraEbooks
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Aozora Ebooks
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "GPL-3.0. Based on AozoraEpub3 by hmdev."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Aozora Bunko text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.zip-archive, com.rarlab.rar-archive, com.github.saltymouse.cbz]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.github.saltymouse.cbz
            UTTypeDescription: Comic Book archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
